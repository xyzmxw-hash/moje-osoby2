<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moje osoby</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #eef2ff, #f8fafc);
    color: #172033;
    min-height: 100vh;
}

.container {
    width: 92%;
    max-width: 650px;
    margin: auto;
    padding: 30px 0 70px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

h1 {
    margin: 0;
    font-size: 29px;
}

.subtitle {
    margin-top: 5px;
    color: #718096;
    font-size: 14px;
}

button {
    border: none;
    cursor: pointer;
    font-family: inherit;
}

.add-btn {
    background: #4f46e5;
    color: white;
    padding: 12px 16px;
    border-radius: 14px;
    font-weight: bold;
}

.search {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 15px;
    font-size: 16px;
    outline: none;
    margin-bottom: 14px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.07);
}

/* BACKUP */

.backup-box {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
}

.backup-btn {
    flex: 1;
    padding: 11px 10px;
    border-radius: 12px;
    background: white;
    color: #475569;
    font-weight: bold;
    box-shadow: 0 5px 18px rgba(0,0,0,0.06);
}

.backup-btn:hover {
    background: #f8fafc;
}

/* OSOBY */

.person {
    background: white;
    padding: 18px;
    border-radius: 16px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    box-shadow: 0 5px 18px rgba(0,0,0,0.06);
    transition: 0.15s;
}

.person:hover {
    transform: translateY(-2px);
}

.name {
    font-size: 17px;
    font-weight: bold;
}

.arrow {
    font-size: 24px;
    color: #94a3b8;
}

.empty {
    text-align: center;
    color: #94a3b8;
    padding: 30px;
}

/* MODALE */

.modal-bg {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15,23,42,0.5);
    justify-content: center;
    align-items: center;
    padding: 20px;
    z-index: 1000;
}

.modal {
    background: white;
    width: 100%;
    max-width: 520px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 25px;
    border-radius: 22px;
}

.modal h2 {
    margin-top: 0;
}

label {
    display: block;
    font-size: 13px;
    font-weight: bold;
    margin: 12px 0 6px;
}

input,
textarea {
    width: 100%;
    padding: 13px;
    border: 1px solid #dbe1ea;
    border-radius: 12px;
    font-size: 15px;
    font-family: inherit;
    outline: none;
}

textarea {
    min-height: 150px;
    resize: vertical;
}

input:focus,
textarea:focus {
    border-color: #4f46e5;
}

.buttons {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 18px;
}

.btn {
    padding: 12px 15px;
    border-radius: 11px;
    font-weight: bold;
}

.primary {
    background: #4f46e5;
    color: white;
}

.secondary {
    background: #eef2ff;
    color: #4338ca;
}

.gray {
    background: #f1f5f9;
    color: #475569;
}

.danger {
    background: #fee2e2;
    color: #dc2626;
}

/* INFORMACJE OSOBY */

.info-box {
    background: #f8fafc;
    border-radius: 15px;
    padding: 17px;
    margin-top: 15px;
}

.date-box {
    color: #4f46e5;
    font-weight: bold;
    margin-bottom: 10px;
}

.phone-box {
    margin-bottom: 10px;
}

.phone-box a {
    color: #16a34a;
    font-weight: bold;
    text-decoration: none;
}

.description-box {
    line-height: 1.6;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    word-break: break-word;
}

/* PODPIS */

.signature {
    position: fixed;
    right: 12px;
    bottom: 8px;
    font-size: 11px;
    color: #94a3b8;
}

@media (max-width: 500px) {

    .container {
        padding-top: 20px;
    }

    h1 {
        font-size: 25px;
    }

    .add-btn {
        padding: 10px 13px;
    }

    .backup-box {
        flex-direction: column;
    }

    .backup-btn {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">

        <div>
            <h1>Moje osoby</h1>
            <div class="subtitle">Twoja prywatna lista</div>
        </div>

        <button class="add-btn" onclick="openAddModal()">
            + Dodaj
        </button>

    </div>


    <input
        type="text"
        id="search"
        class="search"
        placeholder="🔎 Szukaj osoby..."
        oninput="renderPeople()"
    >


    <!-- BACKUP -->

    <div class="backup-box">

        <button
            class="backup-btn"
            onclick="exportBackup()"
        >
            💾 Zapisz backup
        </button>

        <button
            class="backup-btn"
            onclick="document.getElementById('backupFile').click()"
        >
            📂 Wczytaj backup
        </button>

        <input
            type="file"
            id="backupFile"
            accept=".json,application/json"
            style="display:none"
        >

    </div>


    <div id="peopleList"></div>

</div>


<div class="signature">
    nr M.K
</div>


<!-- =========================
     MODAL DODAWANIA / EDYCJI
========================= -->

<div class="modal-bg" id="formModal">

    <div class="modal">

        <h2 id="formTitle">
            Dodaj osobę
        </h2>


        <label for="firstName">
            Imię
        </label>

        <input
            type="text"
            id="firstName"
            placeholder="Imię"
        >


        <label for="lastName">
            Nazwisko
        </label>

        <input
            type="text"
            id="lastName"
            placeholder="Nazwisko"
        >


        <label for="phone">
            📞 Numer telefonu
        </label>

        <input
            type="tel"
            id="phone"
            placeholder="np. 501 234 567"
        >


        <label for="date">
            📅 Data
        </label>

        <input
            type="date"
            id="date"
        >


        <label for="description">
            Opis
        </label>

        <textarea
            id="description"
            placeholder="Wpisz opis..."
        ></textarea>


        <div class="buttons">

            <button
                class="btn primary"
                onclick="savePerson()"
            >
                💾 Zapisz
            </button>

            <button
                class="btn gray"
                onclick="closeFormModal()"
            >
                Anuluj
            </button>

        </div>

    </div>

</div>


<!-- =========================
     MODAL OSOBY
========================= -->

<div class="modal-bg" id="personModal">

    <div class="modal">

        <h2 id="personName"></h2>


        <div class="info-box">

            <div
                class="phone-box"
                id="personPhone"
            ></div>

            <div
                class="date-box"
                id="personDate"
            ></div>

            <div
                class="description-box"
                id="personDescriptionText"
            ></div>

        </div>


        <div class="buttons">

            <button
                class="btn primary"
                onclick="editPerson()"
            >
                ✏️ Edytuj
            </button>

            <button
                class="btn danger"
                onclick="deletePerson()"
            >
                🗑️ Usuń
            </button>

            <button
                class="btn gray"
                onclick="closePersonModal()"
            >
                Zamknij
            </button>

        </div>

    </div>

</div>


<script>

/* =========================
   DANE
========================= */

let people = JSON.parse(
    localStorage.getItem("people") || "[]"
);

let currentPersonIndex = null;


/* =========================
   LOCAL STORAGE
========================= */

function saveToStorage() {

    localStorage.setItem(
        "people",
        JSON.stringify(people)
    );

}


/* =========================
   FORMAT DATY
========================= */

function formatDate(date) {

    if (!date) {
        return "";
    }

    const parts = date.split("-");

    if (parts.length !== 3) {
        return date;
    }

    return (
        parts[2] +
        "." +
        parts[1] +
        "." +
        parts[0]
    );

}


/* =========================
   BEZPIECZNY TEKST
========================= */

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text ?? "";

    return div.innerHTML;

}


/* =========================
   LISTA OSÓB
========================= */

function renderPeople() {

    const list =
        document.getElementById(
            "peopleList"
        );

    const search =
        document.getElementById(
            "search"
        ).value
        .toLowerCase()
        .trim();


    list.innerHTML = "";


    const filtered =
        people.filter(function(person) {

            const fullName =
                person.firstName +
                " " +
                person.lastName;

            const phone =
                person.phone || "";

            return (
                fullName
                    .toLowerCase()
                    .includes(search)
                ||
                phone
                    .toLowerCase()
                    .includes(search)
            );

        });


    if (filtered.length === 0) {

        list.innerHTML = `
            <div class="empty">
                Brak osób
            </div>
        `;

        return;
    }


    filtered.forEach(function(person) {

        const originalIndex =
            people.indexOf(person);


        const div =
            document.createElement("div");

        div.className =
            "person";


        div.onclick = function() {

            openPersonModal(
                originalIndex
            );

        };


        div.innerHTML = `
            <div class="name">
                ${escapeHtml(person.firstName)}
                ${escapeHtml(person.lastName)}
            </div>

            <div class="arrow">
                ›
            </div>
        `;


        list.appendChild(div);

    });

}


/* =========================
   DODAWANIE
========================= */

function openAddModal() {

    currentPersonIndex = null;


    document.getElementById(
        "formTitle"
    ).textContent =
        "Dodaj osobę";


    document.getElementById(
        "firstName"
    ).value = "";


    document.getElementById(
        "lastName"
    ).value = "";


    document.getElementById(
        "phone"
    ).value = "";


    document.getElementById(
        "date"
    ).value = "";


    document.getElementById(
        "description"
    ).value = "";


    document.getElementById(
        "formModal"
    ).style.display =
        "flex";

}


/* =========================
   EDYCJA
========================= */

function editPerson() {

    if (
        currentPersonIndex === null
    ) {
        return;
    }


    const person =
        people[currentPersonIndex];


    document.getElementById(
        "formTitle"
    ).textContent =
        "Edytuj osobę";


    document.getElementById(
        "firstName"
    ).value =
        person.firstName || "";


    document.getElementById(
        "lastName"
    ).value =
        person.lastName || "";


    document.getElementById(
        "phone"
    ).value =
        person.phone || "";


    document.getElementById(
        "date"
    ).value =
        person.date || "";


    document.getElementById(
        "description"
    ).value =
        person.description || "";


    closePersonModal();


    document.getElementById(
        "formModal"
    ).style.display =
        "flex";

}


/* =========================
   ZAPIS OSOBY
========================= */

function savePerson() {

    const firstName =
        document.getElementById(
            "firstName"
        ).value.trim();


    const lastName =
        document.getElementById(
            "lastName"
        ).value.trim();


    const phone =
        document.getElementById(
            "phone"
        ).value.trim();


    const date =
        document.getElementById(
            "date"
        ).value;


    const description =
        document.getElementById(
            "description"
        ).value.trim();


    if (
        !firstName ||
        !lastName
    ) {

        alert(
            "Podaj imię i nazwisko."
        );

        return;
    }


    const person = {

        firstName:
            firstName,

        lastName:
            lastName,

        phone:
            phone,

        date:
            date,

        description:
            description

    };


    if (
        currentPersonIndex === null
    ) {

        people.push(person);

    } else {

        people[currentPersonIndex] =
            person;

    }


    saveToStorage();

    renderPeople();

    closeFormModal();

}


/* =========================
   OTWIERANIE OSOBY
========================= */

function openPersonModal(index) {

    currentPersonIndex =
        index;


    const person =
        people[index];


    document.getElementById(
        "personName"
    ).textContent =
        person.firstName +
        " " +
        person.lastName;


    /* TELEFON */

    const phoneElement =
        document.getElementById(
            "personPhone"
        );


    if (person.phone) {

        const safePhone =
            person.phone.replace(
                /[^0-9+]/g,
                ""
            );


        phoneElement.innerHTML = `
            📞
            <a href="tel:${safePhone}">
                ${escapeHtml(person.phone)}
            </a>
        `;

    } else {

        phoneElement.textContent =
            "📞 Brak numeru telefonu";

    }


    /* DATA */

    document.getElementById(
        "personDate"
    ).textContent =
        person.date
            ? "📅 " +
              formatDate(person.date)
            : "📅 Brak daty";


    /* OPIS */

    document.getElementById(
        "personDescriptionText"
    ).textContent =
        person.description ||
        "Brak opisu.";


    document.getElementById(
        "personModal"
    ).style.display =
        "flex";

}


/* =========================
   USUWANIE
========================= */

function deletePerson() {

    if (
        currentPersonIndex === null
    ) {
        return;
    }


    const person =
        people[currentPersonIndex];


    const confirmed =
        confirm(
            "Czy na pewno chcesz usunąć " +
            person.firstName +
            " " +
            person.lastName +
            "?"
        );


    if (!confirmed) {
        return;
    }


    people.splice(
        currentPersonIndex,
        1
    );


    saveToStorage();

    renderPeople();

    closePersonModal();

}


/* =========================
   ZAMYKANIE MODALI
========================= */

function closeFormModal() {

    document.getElementById(
        "formModal"
    ).style.display =
        "none";

}


function closePersonModal() {

    document.getElementById(
        "personModal"
    ).style.display =
        "none";

}


/* =========================
   BACKUP — ZAPIS
========================= */

function exportBackup() {

    const backup = {

        version: 1,

        createdAt:
            new Date().toISOString(),

        people:
            people

    };


    const json =
        JSON.stringify(
            backup,
            null,
            2
        );


    const blob =
        new Blob(
            [json],
            {
                type:
                    "application/json"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    link.href =
        url;


    link.download =
        "moje-osoby-backup.json";


    document.body.appendChild(
        link
    );


    link.click();


    document.body.removeChild(
        link
    );


    setTimeout(function() {

        URL.revokeObjectURL(
            url
        );

    }, 1000);


    alert(
        "Backup został zapisany."
    );

}


/* =========================
   BACKUP — WCZYTANIE
========================= */

document
    .getElementById(
        "backupFile"
    )
    .addEventListener(
        "change",
        function(event) {

            const file =
                event.target.files[0];


            if (!file) {
                return;
            }


            const reader =
                new FileReader();


            reader.onload =
                function() {

                    try {

                        const imported =
                            JSON.parse(
                                reader.result
                            );


                        let importedPeople;


                        if (
                            Array.isArray(
                                imported
                            )
                        ) {

                            importedPeople =
                                imported;

                        } else {

                            importedPeople =
                                imported.people;

                        }


                        if (
                            !Array.isArray(
                                importedPeople
                            )
                        ) {

                            throw new Error();

                        }


                        const cleanPeople =
                            importedPeople
                            .map(
                                function(person) {

                                    return {

                                        firstName:
                                            String(
                                                person.firstName ?? ""
                                            ).trim(),

                                        lastName:
                                            String(
                                                person.lastName ?? ""
                                            ).trim(),

                                        phone:
                                            typeof person.phone === "string"
                                                ? person.phone
                                                : "",

                                        date:
                                            typeof person.date === "string"
                                                ? person.date
                                                : "",

                                        description:
                                            typeof person.description === "string"
                                                ? person.description
                                                : ""

                                    };

                                }
                            )
                            .filter(
                                function(person) {

                                    return (
                                        person.firstName &&
                                        person.lastName
                                    );

                                }
                            );


                        const confirmed =
                            confirm(
                                "Wczytanie backupu zastąpi obecne osoby.\n\n" +
                                "Liczba osób w backupie: " +
                                cleanPeople.length +
                                "\n\n" +
                                "Czy chcesz kontynuować?"
                            );


                        if (!confirmed) {

                            event.target.value =
                                "";

                            return;

                        }


                        people =
                            cleanPeople;


                        saveToStorage();

                        renderPeople();


                        alert(
                            "Backup został wczytany.\n\n" +
                            "Przywrócono " +
                            cleanPeople.length +
                            " osób."
                        );


                    } catch (error) {

                        alert(
                            "Nie udało się wczytać backupu.\n\n" +
                            "Plik może być uszkodzony albo nie jest prawidłowym backupem."
                        );

                    }


                    event.target.value =
                        "";

                };


            reader.readAsText(
                file
            );

        }
    );


/* =========================
   KLIKNIĘCIE POZA MODALEM
========================= */

document
    .getElementById(
        "formModal"
    )
    .addEventListener(
        "click",
        function(event) {

            if (
                event.target === this
            ) {

                closeFormModal();

            }

        }
    );


document
    .getElementById(
        "personModal"
    )
    .addEventListener(
        "click",
        function(event) {

            if (
                event.target === this
            ) {

                closePersonModal();

            }

        }
    );


/* =========================
   START
========================= */

renderPeople();

</script>

</body>
</html>
